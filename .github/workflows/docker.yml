name: Build and push Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: carpathians/mrr-autorent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (latest only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Avoid extra attestation package versions that complicate cleanup
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete obsolete tagged versions (never untagged)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ORG="${IMAGE_NAME%%/*}"
          PKG="${IMAGE_NAME##*/}"
          echo "Pruning tagged versions that are not 'latest' (keeping untagged platform manifests)…"
          # Multi-arch children are often untagged — deleting them breaks :latest.
          # Only delete versions that HAVE tags and none of those tags is "latest".
          gh api --paginate "/orgs/${ORG}/packages/container/${PKG}/versions" \
            --jq '.[] | select((.metadata.container.tags | length) > 0) | select((.metadata.container.tags | index("latest")) | not) | {id, tags: .metadata.container.tags}' \
            | while read -r line; do
                id=$(echo "$line" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')
                tags=$(echo "$line" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).tags.join(",")')
                echo "Deleting tagged version id=${id} tags=${tags}"
                gh api --method DELETE "/orgs/${ORG}/packages/container/${PKG}/versions/${id}" \
                  || echo "WARN: could not delete ${id}"
              done
          echo "Remaining:"
          gh api --paginate "/orgs/${ORG}/packages/container/${PKG}/versions" \
            --jq '.[] | {id, tags: .metadata.container.tags}' || true
